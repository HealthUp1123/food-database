name: Daten validieren

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: origin/main holen
        run: git fetch origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: foods.json validieren
        run: node scripts/validate.mjs
      - name: Worker-Handler testen
        run: node scripts/test-worker.mjs
      - name: Schutztest gegen Datenverlust
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/guard-foods.mjs
